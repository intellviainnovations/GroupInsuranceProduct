name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene checks
        run: bash scripts/check_repo.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Lint (ruff check)
        run: ruff check src tests
      - name: Format check (ruff format)
        run: ruff format --check src tests
      - name: Type check (mypy, strict on src/backend)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned dependencies
        run: pip-audit -r requirements/dev.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend project
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found; frontend checks skipped"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: npm run test
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build
      - name: Dependency audit (high and above)
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high

  # The release-bundle job is added when the release agent starts.
